# GENERADO por scripts/gen-cms-config.mjs — no editar a mano.
# Los campos de los archivos de idioma se derivan del JSON real: un campo
# que faltara aquí borraría esa traducción al guardar desde el CMS.
backend:
  name: "github"
  repo: "TrodriTen-Projects/luxury-smile-architects"
  branch: "master"
  base_url: "https://luxurysmilearchitects.eu"
  auth_endpoint: "api/auth"
  commit_messages:
    update: "contenido: actualiza {{collection}}"
    uploadMedia: "contenido: sube {{path}}"
    deleteMedia: "contenido: elimina {{path}}"
media_folder: "public/media"
public_folder: "/media"
locale: "es"
publish_mode: "simple"
collections:
  - name: "contenido"
    label: "Contenido"
    files:
      - name: "site"
        label: "Clínica, equipo y tratamientos"
        file: "public/content/site.json"
        description: "Datos de la clínica, equipo, tratamientos, casos y reseñas. Al guardar se publica solo en unos minutos."
        fields:
          - name: "_readme"
            label: "Notas internas (no tocar)"
            widget: "text"
            required: false
          - name: "hero"
            label: "Portada"
            widget: "object"
            fields:
              - name: "image"
                label: "Foto principal"
                widget: "image"
              - name: "fallback"
                label: "Foto alternativa"
                widget: "image"
                required: false
              - name: "position"
                label: "Encuadre (p. ej. 50% 0%)"
                widget: "string"
                hint: "El segundo número sube o baja el recorte: 0% arriba, 100% abajo. También decide el recorte de la imagen que se ve al compartir el enlace."
          - name: "logo"
            label: "Logotipo"
            widget: "object"
            fields:
              - name: "image"
                label: "Imagen del logo"
                widget: "image"
                required: false
          - name: "treatments"
            label: "Tratamientos"
            label_singular: "Tratamiento"
            widget: "list"
            summary: "{{fields.name.es}}"
            hint: "Cada tratamiento aparece en la página de Tratamientos, en el inicio y en el desplegable de Contacto. También se publica como dato estructurado para Google."
            fields:
              - name: "id"
                label: "Identificador único (sin espacios)"
                widget: "string"
                pattern:
                  - "^[a-z0-9-]+$"
                  - "Solo minúsculas, números y guiones"
              - name: "image"
                label: "Imagen"
                widget: "image"
              - name: "name"
                label: "Nombre"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
              - name: "tagline"
                label: "Frase corta"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
              - name: "summary"
                label: "Descripción"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "text"
                  - name: "en"
                    label: "Inglés"
                    widget: "text"
          - name: "team"
            label: "Equipo"
            label_singular: "Persona"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - name: "id"
                label: "Identificador único (sin espacios)"
                widget: "string"
                pattern:
                  - "^[a-z0-9-]+$"
                  - "Solo minúsculas, números y guiones"
              - name: "name"
                label: "Nombre completo"
                widget: "string"
              - name: "photo"
                label: "Foto"
                widget: "image"
              - name: "role"
                label: "Puesto"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
              - name: "credentials"
                label: "Titulación"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
              - name: "bio"
                label: "Biografía"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "text"
                  - name: "en"
                    label: "Inglés"
                    widget: "text"
          - name: "beforeAfter"
            label: "Casos antes y después"
            label_singular: "Caso"
            widget: "list"
            fields:
              - name: "before"
                label: "Antes"
                widget: "image"
              - name: "after"
                label: "Después"
                widget: "image"
          - name: "business"
            label: "Datos de la clínica"
            widget: "object"
            hint: "Estos datos alimentan la ficha que leen Google y los asistentes de IA. Deben coincidir exactamente con Google Business Profile."
            fields:
              - name: "placeQuery"
                label: "Dirección para el mapa"
                widget: "string"
              - name: "phone"
                label: "Teléfono principal"
                widget: "string"
                hint: "Formato internacional sin espacios, p. ej. +34689440906. Debe ser el mismo que figura en Google Business Profile."
                pattern:
                  - "^\\+[0-9]{9,15}$"
                  - "Formato internacional, p. ej. +34689440906"
              - name: "phoneSecondary"
                label: "Teléfono secundario"
                widget: "string"
                required: false
                pattern:
                  - "^\\+[0-9]{9,15}$"
                  - "Formato internacional, p. ej. +34659716995"
              - name: "whatsapp"
                label: "WhatsApp"
                widget: "string"
                pattern:
                  - "^\\+[0-9]{9,15}$"
                  - "Formato internacional, p. ej. +34689440906"
              - name: "email"
                label: "Email"
                widget: "string"
              - name: "address"
                label: "Dirección"
                widget: "object"
                fields:
                  - name: "street"
                    label: "Calle y número"
                    widget: "string"
                  - name: "district"
                    label: "Barrio"
                    widget: "string"
                  - name: "postalCode"
                    label: "Código postal"
                    widget: "string"
                  - name: "city"
                    label: "Ciudad"
                    widget: "string"
                  - name: "region"
                    label: "Provincia"
                    widget: "string"
                  - name: "country"
                    label: "País (2 letras, p. ej. ES)"
                    widget: "string"
                    pattern:
                      - "^[A-Z]{2}$"
                      - "Dos letras mayúsculas"
              - name: "geo"
                label: "Coordenadas"
                widget: "object"
                hint: "Se obtienen en Google Maps: clic derecho sobre el local y 'Qué hay aquí'."
                fields:
                  - name: "latitude"
                    label: "Latitud"
                    widget: "number"
                    value_type: "float"
                  - name: "longitude"
                    label: "Longitud"
                    widget: "number"
                    value_type: "float"
              - name: "hours"
                label: "Horario"
                widget: "object"
                hint: "Solo los días que se abre. No listar un día equivale a cerrado."
                fields:
                  - name: "days"
                    label: "Días (en inglés: Monday, Tuesday…)"
                    widget: "list"
                  - name: "opens"
                    label: "Abre (HH:MM)"
                    widget: "string"
                    pattern:
                      - "^[0-2][0-9]:[0-5][0-9]$"
                      - "Formato HH:MM"
                  - name: "closes"
                    label: "Cierra (HH:MM)"
                    widget: "string"
                    pattern:
                      - "^[0-2][0-9]:[0-5][0-9]$"
                      - "Formato HH:MM"
              - name: "reviewsUrl"
                label: "Enlace a las reseñas de Google"
                widget: "string"
              - name: "instagram"
                label: "Instagram"
                widget: "string"
              - name: "rating"
                label: "Nota media (p. ej. 5.0)"
                widget: "string"
                required: false
              - name: "reviewsCount"
                label: "Número de reseñas (texto)"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
          - name: "tracking"
            label: "Medición"
            widget: "object"
            hint: "Dejar vacío desactiva esa herramienta, sin errores. Nada se activa hasta que el visitante acepta las cookies."
            fields:
              - name: "metaPixelId"
                label: "ID del píxel de Meta"
                widget: "string"
                required: false
                pattern:
                  - "^$|^[0-9]{15,16}$"
                  - "15 o 16 dígitos, o vacío para desactivarlo"
              - name: "ga4MeasurementId"
                label: "ID de medición de Google Analytics 4"
                widget: "string"
                required: false
                pattern:
                  - "^$|^G-[A-Z0-9]{6,12}$"
                  - "Empieza por G-, o vacío para desactivarlo"
          - name: "reviews"
            label: "Reseñas"
            label_singular: "Reseña"
            widget: "list"
            summary: "{{fields.author}}"
            hint: "Se muestran en la web como contenido. No se publican como dato estructurado: las directrices de Google prohíben marcar reseñas copiadas de otro sitio."
            fields:
              - name: "author"
                label: "Autor"
                widget: "string"
              - name: "rating"
                label: "Estrellas (1 a 5)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
              - name: "text"
                label: "Texto"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "text"
                  - name: "en"
                    label: "Inglés"
                    widget: "text"
              - name: "date"
                label: "Fecha (texto)"
                widget: "object"
                fields:
                  - name: "es"
                    label: "Español"
                    widget: "string"
                  - name: "en"
                    label: "Inglés"
                    widget: "string"
